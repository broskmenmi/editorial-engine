name: Publish Spotify playlists

on:
  push:
    branches: [main]
    paths:
      - "playlists/**/ledger.md"
      - "playlists/**/spotify.json"
      - "playlists/**/cover.jpg.base64"
      - "apps/spotify-publisher/**"
      - ".github/workflows/publish-spotify.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-publisher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test publisher
        working-directory: apps/spotify-publisher
        run: npm test

      - name: Publish and verify configured playlists
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' playlist_dir; do
            if [[ ! -f "$playlist_dir/ledger.md" || ! -f "$playlist_dir/spotify.json" ]]; then
              continue
            fi
            found=1
            ledger_commit="$(git log -1 --format=%H -- "$playlist_dir/ledger.md")"
            echo "Publishing $playlist_dir from ledger commit $ledger_commit"
            LEDGER_COMMIT="$ledger_commit" node apps/spotify-publisher/src/index.js \
              --playlist-dir "$playlist_dir" \
              --allow-empty
          done < <(find playlists -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)

          if [[ "$found" -eq 0 ]]; then
            echo "No configured playlist directories found."
            exit 1
          fi

      - name: Persist playlist identities and verified statuses
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          changed=()
          while IFS= read -r -d '' file; do
            if ! git diff --quiet -- "$file"; then
              changed+=("$file")
            fi
          done < <(find playlists -mindepth 2 -maxdepth 2 -type f \( -name spotify.json -o -name spotify-status.json \) -print0 | sort -z)

          if [[ "${#changed[@]}" -eq 0 ]]; then
            exit 0
          fi

          temp_dir="$(mktemp -d)"
          for file in "${changed[@]}"; do
            mkdir -p "$temp_dir/$(dirname "$file")"
            cp "$file" "$temp_dir/$file"
          done

          git config user.name "editorial-engine[bot]"
          git config user.email "editorial-engine[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin main

            if git diff --name-only "$GITHUB_SHA"..origin/main -- \
              ':(glob)playlists/*/ledger.md' \
              ':(glob)playlists/*/spotify.json' \
              ':(glob)playlists/*/cover.jpg.base64' \
              apps/spotify-publisher | grep -q .; then
              echo "Newer publication inputs exist; skipping stale Spotify status."
              exit 0
            fi

            git reset --hard origin/main
            for file in "${changed[@]}"; do
              mkdir -p "$(dirname "$file")"
              cp "$temp_dir/$file" "$file"
            done

            if git diff --quiet -- "${changed[@]}"; then
              exit 0
            fi

            git add -- "${changed[@]}"
            git commit -m "Update Spotify publication status [skip ci]"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Status push raced with another commit; retrying attempt $attempt."
            sleep $((attempt * 2))
          done

          echo "Could not persist Spotify publication status after four attempts."
          exit 1
