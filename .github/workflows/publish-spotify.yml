name: Publish Spotify playlists

on:
  workflow_dispatch:
    inputs:
      playlist_dir:
        description: Explicitly authorized playlist to publish
        required: true
        type: choice
        options:
          - playlists/strange-gait
          - playlists/groove-over-noise

permissions:
  contents: write

concurrency:
  group: spotify-publisher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYLIST_DIR: ${{ inputs.playlist_dir }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test publisher
        working-directory: apps/spotify-publisher
        run: npm test

      - name: Publish and verify selected playlist
        shell: bash
        run: |
          set -euo pipefail
          case "$PLAYLIST_DIR" in
            playlists/strange-gait|playlists/groove-over-noise) ;;
            *) echo "Invalid publication target"; exit 1 ;;
          esac
          test -f "$PLAYLIST_DIR/ledger.md"
          test -f "$PLAYLIST_DIR/spotify.json"
          ledger_commit="$(git log -1 --format=%H -- "$PLAYLIST_DIR/ledger.md")"
          LEDGER_COMMIT="$ledger_commit" node apps/spotify-publisher/src/index.js \
            --playlist-dir "$PLAYLIST_DIR"

      - name: Persist playlist identities and verified statuses
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          changed=()
          for file in "$PLAYLIST_DIR/spotify.json" "$PLAYLIST_DIR/spotify-status.json"; do
            if ! git diff --quiet -- "$file"; then
              changed+=("$file")
            fi
          done

          if [[ "${#changed[@]}" -eq 0 ]]; then
            exit 0
          fi

          temp_dir="$(mktemp -d)"
          for file in "${changed[@]}"; do
            mkdir -p "$temp_dir/$(dirname "$file")"
            cp "$file" "$temp_dir/$file"
          done

          git config user.name "editorial-engine[bot]"
          git config user.email "editorial-engine[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin main

            if git diff --name-only "$GITHUB_SHA"..origin/main -- \
              "$PLAYLIST_DIR/ledger.md" \
              "$PLAYLIST_DIR/spotify.json" \
              "$PLAYLIST_DIR/cover.jpg.base64" \
              .github/workflows/publish-spotify.yml apps/spotify-publisher | grep -q .; then
              echo "Newer publication inputs exist; skipping stale Spotify status."
              exit 0
            fi

            git reset --hard origin/main
            for file in "${changed[@]}"; do
              mkdir -p "$(dirname "$file")"
              cp "$temp_dir/$file" "$file"
            done

            if git diff --quiet -- "${changed[@]}"; then
              exit 0
            fi

            git add -- "${changed[@]}"
            git commit -m "Update Spotify publication status [skip ci]"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Status push raced with another commit; retrying attempt $attempt."
            sleep $((attempt * 2))
          done

          echo "Could not persist Spotify publication status after four attempts."
          exit 1
