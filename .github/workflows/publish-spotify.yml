name: Publish Spotify playlists

on:
  push:
    branches: [main]
    paths:
      - 'playlists/**/ledger.md'
      - 'playlists/**/spotify.json'
      - 'playlists/**/cover.jpg.base64'
      - 'publication.json'
      - 'apps/spotify-publisher/**'
      - '.github/workflows/publish-spotify.yml'
  workflow_dispatch:
    inputs:
      playlist_dir:
        description: Explicitly authorized playlist to publish
        required: true
        type: choice
        options:
          - playlists/strange-gait
          - playlists/groove-over-noise

permissions:
  contents: write

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.select.outputs.targets }}
      has_targets: ${{ steps.select.outputs.has_targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test publisher and publication policy
        working-directory: apps/spotify-publisher
        run: npm test
      - name: Select publication targets
        id: select
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          REQUESTED_PLAYLIST_DIR: ${{ inputs.playlist_dir }}
        run: node apps/spotify-publisher/src/publication-policy.js

  publish:
    needs: plan
    if: needs.plan.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      matrix:
        playlist_dir: ${{ fromJSON(needs.plan.outputs.targets) }}
    concurrency:
      group: spotify-publisher-${{ matrix.playlist_dir }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYLIST_DIR: ${{ matrix.playlist_dir }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check publication inputs are current
        id: fresh
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git diff --quiet "$GITHUB_SHA"..origin/main -- \
            "$PLAYLIST_DIR/ledger.md" "$PLAYLIST_DIR/spotify.json" \
            "$PLAYLIST_DIR/cover.jpg.base64" publication.json \
            .github/workflows/publish-spotify.yml apps/spotify-publisher; then
            echo "Newer publication inputs exist; skipping this stale run."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish and verify selected playlist
        if: steps.fresh.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          case "$PLAYLIST_DIR" in
            playlists/strange-gait|playlists/groove-over-noise) ;;
            *) echo "Invalid publication target"; exit 1 ;;
          esac
          test -f "$PLAYLIST_DIR/ledger.md"
          test -f "$PLAYLIST_DIR/spotify.json"
          ledger_commit="$(git log -1 --format=%H -- "$PLAYLIST_DIR/ledger.md")"
          LEDGER_COMMIT="$ledger_commit" node apps/spotify-publisher/src/index.js \
            --playlist-dir "$PLAYLIST_DIR"

      - name: Persist playlist identities and verified statuses
        if: always() && steps.fresh.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          changed=()
          for file in "$PLAYLIST_DIR/spotify.json" "$PLAYLIST_DIR/spotify-status.json"; do
            if ! git diff --quiet -- "$file"; then
              changed+=("$file")
            fi
          done

          if [[ "${#changed[@]}" -eq 0 ]]; then
            exit 0
          fi

          temp_dir="$(mktemp -d)"
          for file in "${changed[@]}"; do
            mkdir -p "$temp_dir/$(dirname "$file")"
            cp "$file" "$temp_dir/$file"
          done

          git config user.name "editorial-engine[bot]"
          git config user.email "editorial-engine[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin main

            if git diff --name-only "$GITHUB_SHA"..origin/main -- \
              "$PLAYLIST_DIR/ledger.md" \
              "$PLAYLIST_DIR/spotify.json" \
              "$PLAYLIST_DIR/cover.jpg.base64" \
              .github/workflows/publish-spotify.yml publication.json apps/spotify-publisher | grep -q .; then
              echo "Newer publication inputs exist; skipping stale Spotify status."
              exit 0
            fi

            git reset --hard origin/main
            for file in "${changed[@]}"; do
              mkdir -p "$(dirname "$file")"
              cp "$temp_dir/$file" "$file"
            done

            if git diff --quiet -- "${changed[@]}"; then
              exit 0
            fi

            git add -- "${changed[@]}"
            git commit -m "Update Spotify publication status [skip ci]"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Status push raced with another commit; retrying attempt $attempt."
            sleep $((attempt * 2))
          done

          echo "Could not persist Spotify publication status after four attempts."
          exit 1
