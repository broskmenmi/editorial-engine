name: Build playlist journey maps

on:
  push:
    branches: [main]
    paths:
      - "playlists/**/ledger.md"
      - "playlists/**/journey-annotations.json"
      - "playlists/**/under-review.md"
      - "playlists/**/spotify.json"
      - "apps/journey-map/**"
      - ".github/workflows/build-journey-map.yml"
  workflow_dispatch:
    inputs:
      playlist_dir:
        description: Playlist map to rebuild
        required: true
        type: choice
        options:
          - playlists/strange-gait
          - playlists/groove-over-noise

permissions:
  contents: write

concurrency:
  group: journey-map-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REQUESTED_PLAYLIST_DIR: ${{ inputs.playlist_dir }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Select affected playlists
        shell: bash
        run: |
          set -euo pipefail
          targets="$RUNNER_TEMP/journey-map-targets.txt"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$REQUESTED_PLAYLIST_DIR" in
              playlists/strange-gait|playlists/groove-over-noise) ;;
              *) echo "Invalid map target"; exit 1 ;;
            esac
            printf '%s\n' "$REQUESTED_PLAYLIST_DIR" > "$targets"
          else
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- \
              ':(glob)playlists/*/ledger.md' \
              ':(glob)playlists/*/journey-annotations.json' \
              ':(glob)playlists/*/under-review.md' \
              ':(glob)playlists/*/spotify.json' \
              | sed 's|/[^/]*$||' | sort -u > "$targets"
          fi

      - name: Build non-empty journey maps
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r playlist_dir; do
            ledger="$playlist_dir/ledger.md"
            annotations="$playlist_dir/journey-annotations.json"
            if [[ ! -f "$ledger" || ! -f "$annotations" ]]; then
              continue
            fi
            if ! grep -q 'spotify:track:' "$ledger"; then
              echo "Skipping empty ledger: $playlist_dir"
              continue
            fi
            echo "Building journey map for $playlist_dir"
            node --import ./apps/journey-map/src/spotify-fetch-shim.js \
              apps/journey-map/src/index.js \
              --playlist-dir "$playlist_dir"
            node apps/journey-map/src/normalize-playlist.js "$playlist_dir"
          done < "$RUNNER_TEMP/journey-map-targets.txt"

      - name: Persist generated maps
        shell: bash
        run: |
          set -euo pipefail
          changed=()
          while IFS= read -r playlist_dir; do
            for file in "$playlist_dir/journey-map.json" "$playlist_dir/journey-map.svg"; do
              if [[ -n "$(git status --porcelain -- "$file")" ]]; then
                changed+=("$file")
              fi
            done
          done < "$RUNNER_TEMP/journey-map-targets.txt"

          if [[ "${#changed[@]}" -eq 0 ]]; then
            exit 0
          fi

          temp_dir="$(mktemp -d)"
          for file in "${changed[@]}"; do
            mkdir -p "$temp_dir/$(dirname "$file")"
            cp "$file" "$temp_dir/$file"
          done

          git config user.name "editorial-engine[bot]"
          git config user.email "editorial-engine[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin main

            if git diff --name-only "$GITHUB_SHA"..origin/main -- \
              ':(glob)playlists/*/ledger.md' \
              ':(glob)playlists/*/journey-annotations.json' \
              ':(glob)playlists/*/under-review.md' \
              ':(glob)playlists/*/spotify.json' \
              apps/journey-map | grep -q .; then
              echo "Newer map inputs exist; skipping stale generated maps."
              exit 0
            fi

            git reset --hard origin/main
            for file in "${changed[@]}"; do
              mkdir -p "$(dirname "$file")"
              cp "$temp_dir/$file" "$file"
            done

            map_changes=false
            for file in "${changed[@]}"; do
              if [[ -n "$(git status --porcelain -- "$file")" ]]; then
                map_changes=true
                break
              fi
            done
            if [[ "$map_changes" != "true" ]]; then
              exit 0
            fi

            git add -- "${changed[@]}"
            git commit -m "Update playlist journey maps [skip ci]"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Journey-map push raced with another commit; retrying attempt $attempt."
            sleep $((attempt * 2))
          done

          echo "Could not persist journey maps after four attempts."
          exit 1
