name: Build Spotify scout data

on:
  push:
    branches: [main]
    paths:
      - "apps/spotify-scout/**"
      - "playlists/**/scout-request.json"
      - ".github/workflows/spotify-scout.yml"
  workflow_dispatch:
    inputs:
      playlist_dir:
        description: Playlist directory containing scout-request.json
        required: false
        default: playlists/groove-over-noise

permissions:
  contents: write

concurrency:
  group: spotify-scout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target playlist
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          playlist_dir=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            playlist_dir="${{ inputs.playlist_dir }}"
          else
            request_path="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- ':(glob)playlists/*/scout-request.json' | head -n 1)"
            if [[ -n "$request_path" ]]; then
              playlist_dir="$(dirname "$request_path")"
            fi
          fi

          if [[ -z "$playlist_dir" || ! -f "$playlist_dir/scout-request.json" ]]; then
            echo "No scout request changed in this workflow commit; nothing to resolve."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$playlist_dir" in
            playlists/*) ;;
            *) echo "Invalid playlist directory: $playlist_dir"; exit 1 ;;
          esac

          echo "playlist_dir=$playlist_dir" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.resolve.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate immutable scout request history
        if: steps.resolve.outputs.should_run == 'true'
        env:
          PLAYLIST_DIR: ${{ steps.resolve.outputs.playlist_dir }}
        run: node apps/spotify-scout/src/validate-request-history.js "$PLAYLIST_DIR/scout-request.json"

      - name: Validate resolver source state
        if: steps.resolve.outputs.should_run == 'true'
        env:
          PLAYLIST_DIR: ${{ steps.resolve.outputs.playlist_dir }}
        shell: bash
        run: |
          set -euo pipefail
          request_path="$PLAYLIST_DIR/scout-request.json"
          snapshot_path="$PLAYLIST_DIR/scout-data.json"

          if node apps/spotify-scout/src/check-terminal-snapshot.js "$request_path" "$snapshot_path"; then
            exit 0
          else
            snapshot_state=$?
            if [[ "$snapshot_state" -eq 2 ]]; then
              echo "A conflicting terminal snapshot already exists for this runId."
              exit 1
            fi
          fi

          source_commit="$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).sourceCommit)' "$request_path")"
          if ! git merge-base --is-ancestor "$source_commit" "$GITHUB_SHA"; then
            echo "scout-request sourceCommit is not an ancestor of this workflow commit."
            exit 1
          fi

          resolver_inputs=(
            "$PLAYLIST_DIR/ledger.md"
            "$PLAYLIST_DIR/rejected.md"
            "$PLAYLIST_DIR/revisit.md"
            "$PLAYLIST_DIR/discoveries.md"
          )
          if ! git diff --quiet "$source_commit" "$GITHUB_SHA" -- "${resolver_inputs[@]}"; then
            echo "Resolver inputs changed after scout-request sourceCommit; create a new runId from current state."
            exit 1
          fi

      - name: Test scout lifecycle
        if: steps.resolve.outputs.should_run == 'true'
        run: node --test apps/spotify-scout/test/*.test.js

      - name: Build scout data for target playlist
        if: steps.resolve.outputs.should_run == 'true'
        env:
          PLAYLIST_DIR: ${{ steps.resolve.outputs.playlist_dir }}
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$(mktemp -d)"
          mkdir -p "$sandbox/playlists"
          ln -s "$GITHUB_WORKSPACE/$PLAYLIST_DIR" "$sandbox/playlists/groove-over-noise"
          (
            cd "$sandbox"
            node "$GITHUB_WORKSPACE/apps/spotify-scout/src/index.js"
          )

      - name: Persist scout data
        if: steps.resolve.outputs.should_run == 'true'
        env:
          PLAYLIST_DIR: ${{ steps.resolve.outputs.playlist_dir }}
        shell: bash
        run: |
          set -euo pipefail
          request_path="$PLAYLIST_DIR/scout-request.json"
          snapshot_path="$PLAYLIST_DIR/scout-data.json"

          if git diff --quiet -- "$snapshot_path"; then
            exit 0
          fi

          temp_dir="$(mktemp -d)"
          cp "$snapshot_path" "$temp_dir/scout-data.json"

          git config user.name "editorial-engine[bot]"
          git config user.email "editorial-engine[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin main

            resolver_inputs=(
              "$PLAYLIST_DIR/scout-request.json"
              "$PLAYLIST_DIR/ledger.md"
              "$PLAYLIST_DIR/rejected.md"
              "$PLAYLIST_DIR/revisit.md"
              "$PLAYLIST_DIR/discoveries.md"
              "apps/spotify-scout"
              ".github/workflows/spotify-scout.yml"
            )
            if ! git diff --quiet "$GITHUB_SHA"..origin/main -- "${resolver_inputs[@]}"; then
              echo "A newer scout request or resolver input exists; skipping stale candidate data."
              exit 0
            fi

            origin_snapshot="$temp_dir/origin-scout-data.json"
            if git show origin/main:"$snapshot_path" > "$origin_snapshot" 2>/dev/null; then
              if node apps/spotify-scout/src/check-terminal-snapshot.js "$request_path" "$origin_snapshot"; then
                echo "Matching terminal scout snapshot already exists; preserving it."
                exit 0
              else
                snapshot_state=$?
                if [[ "$snapshot_state" -eq 2 ]]; then
                  echo "A conflicting terminal snapshot already exists on origin/main."
                  exit 1
                fi
              fi
            fi

            git reset --hard origin/main
            cp "$temp_dir/scout-data.json" "$snapshot_path"

            if git diff --quiet -- "$snapshot_path"; then
              exit 0
            fi

            git add "$snapshot_path"
            git commit -m "Update Spotify scout data [skip ci]"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Scout-data push raced with another commit; retrying attempt $attempt."
            sleep $((attempt * 2))
          done

          echo "Could not persist Spotify scout data after four attempts."
          exit 1
