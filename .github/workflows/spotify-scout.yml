name: Build Spotify scout data

on:
  push:
    branches: [main]
    paths:
      - "apps/spotify-scout/**"
      - "playlists/groove-over-noise/scout-request.json"
      - ".github/workflows/spotify-scout.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-scout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build scout data
        run: node apps/spotify-scout/src/index.js

      - name: Persist scout data
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- playlists/groove-over-noise/scout-data.json; then
            exit 0
          fi

          temp_dir="$(mktemp -d)"
          cp playlists/groove-over-noise/scout-data.json "$temp_dir/scout-data.json"

          git config user.name "editorial-engine[bot]"
          git config user.email "editorial-engine[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin main

            if ! git diff --quiet "$GITHUB_SHA"..origin/main -- playlists/groove-over-noise/scout-request.json; then
              echo "A newer scout request exists; skipping stale candidate data."
              exit 0
            fi

            git reset --hard origin/main
            cp "$temp_dir/scout-data.json" playlists/groove-over-noise/scout-data.json

            if git diff --quiet -- playlists/groove-over-noise/scout-data.json; then
              exit 0
            fi

            git add playlists/groove-over-noise/scout-data.json
            git commit -m "Update Spotify scout data [skip ci]"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Scout-data push raced with another commit; retrying attempt $attempt."
            sleep $((attempt * 2))
          done

          echo "Could not persist Spotify scout data after four attempts."
          exit 1
