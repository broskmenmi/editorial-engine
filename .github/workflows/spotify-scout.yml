name: Build Spotify scout data

on:
  push:
    branches: [main]
    paths:
      - "apps/spotify-scout/**"
      - "playlists/groove-over-noise/scout-request.json"
      - ".github/workflows/spotify-scout.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-scout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate immutable scout request history
        run: node apps/spotify-scout/src/validate-request-history.js playlists/groove-over-noise/scout-request.json

      - name: Validate resolver source state
        shell: bash
        run: |
          set -euo pipefail

          request_path="playlists/groove-over-noise/scout-request.json"
          snapshot_path="playlists/groove-over-noise/scout-data.json"
          if node apps/spotify-scout/src/check-terminal-snapshot.js "$request_path" "$snapshot_path"; then
            exit 0
          else
            snapshot_state=$?
            if [[ "$snapshot_state" -eq 2 ]]; then
              echo "A conflicting terminal snapshot already exists for this runId."
              exit 1
            fi
          fi

          source_commit="$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).sourceCommit)' "$request_path")"
          if ! git merge-base --is-ancestor "$source_commit" "$GITHUB_SHA"; then
            echo "scout-request sourceCommit is not an ancestor of this workflow commit."
            exit 1
          fi

          resolver_inputs=(
            "playlists/groove-over-noise/ledger.md"
            "playlists/groove-over-noise/rejected.md"
            "playlists/groove-over-noise/revisit.md"
            "playlists/groove-over-noise/discoveries.md"
          )
          if ! git diff --quiet "$source_commit" "$GITHUB_SHA" -- "${resolver_inputs[@]}"; then
            echo "Resolver inputs changed after scout-request sourceCommit; create a new runId from current state."
            exit 1
          fi

      - name: Test scout lifecycle
        run: node --test apps/spotify-scout/test/*.test.js

      - name: Build scout data
        run: node apps/spotify-scout/src/index.js

      - name: Persist scout data
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- playlists/groove-over-noise/scout-data.json; then
            exit 0
          fi

          temp_dir="$(mktemp -d)"
          cp playlists/groove-over-noise/scout-data.json "$temp_dir/scout-data.json"

          git config user.name "editorial-engine[bot]"
          git config user.email "editorial-engine[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin main

            resolver_inputs=(
              "playlists/groove-over-noise/scout-request.json"
              "playlists/groove-over-noise/ledger.md"
              "playlists/groove-over-noise/rejected.md"
              "playlists/groove-over-noise/revisit.md"
              "playlists/groove-over-noise/discoveries.md"
            )
            if ! git diff --quiet "$GITHUB_SHA"..origin/main -- "${resolver_inputs[@]}"; then
              echo "A newer scout request or resolver input exists; skipping stale candidate data."
              exit 0
            fi

            origin_snapshot="$temp_dir/origin-scout-data.json"
            if git show origin/main:playlists/groove-over-noise/scout-data.json > "$origin_snapshot" 2>/dev/null; then
              if node apps/spotify-scout/src/check-terminal-snapshot.js playlists/groove-over-noise/scout-request.json "$origin_snapshot"; then
                echo "Matching terminal scout snapshot already exists; preserving it."
                exit 0
              else
                snapshot_state=$?
                if [[ "$snapshot_state" -eq 2 ]]; then
                  echo "A conflicting terminal snapshot already exists on origin/main."
                  exit 1
                fi
              fi
            fi

            git reset --hard origin/main
            cp "$temp_dir/scout-data.json" playlists/groove-over-noise/scout-data.json

            if git diff --quiet -- playlists/groove-over-noise/scout-data.json; then
              exit 0
            fi

            git add playlists/groove-over-noise/scout-data.json
            git commit -m "Update Spotify scout data [skip ci]"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Scout-data push raced with another commit; retrying attempt $attempt."
            sleep $((attempt * 2))
          done

          echo "Could not persist Spotify scout data after four attempts."
          exit 1
