name: Migrate unified journey site URLs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-unified-journey-site.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy journey-site URLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = "https://broskmenmi.github.io/editorial-engine/"
          legacy = [
              "https://groove-over-noise-map.broskmenmi." + "chatgpt.site",
              root + "strange-gait/",
          ]
          self_path = Path('.github/workflows/migrate-unified-journey-site.yml')

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == self_path:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              changed = text
              for old in legacy:
                  changed = changed.replace(old, root)
              if changed != text:
                  path.write_text(changed, encoding='utf-8')
                  print(f'updated {path}')
          PY

      - name: Persist migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "editorial-engine[bot]"
          git config user.email "editorial-engine[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use unified journey site URL"
          git pull --rebase origin main
          git push origin HEAD:main
